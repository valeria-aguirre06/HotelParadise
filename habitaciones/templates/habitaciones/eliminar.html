<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar habitación - Hotel Paradise</title>
</head>
<body>

    <h1>Eliminar habitación</h1>

    <p>
        ¿Estás seguro de que deseas eliminar
        la habitación {{ habitacion.numero }}?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Sí, eliminar
        </button>
    </form>

    <br>

    <a href="{% url 'lista_habitaciones' %}">
        Cancelar
    </a>

</body>
</html>
