
{% extends 'core/base.html' %}

{% block title %}{{ titulo }} - Hotel Paradise{% endblock %}

{% block content %}

<h1 class="titulo fw-bold">{{ titulo }}</h1>

<p class="text-muted">
    Completa los datos de la reservación.
</p>

<div class="card tarjeta mt-4">
    <div class="card-body p-4">

        <form method="post" class="formulario-reservacion">

            {% csrf_token %}

            {{ form.as_p }}

            <div class="d-flex flex-wrap gap-3 mt-4">

                <button type="submit" class="btn btn-primary">
                    Guardar reservación
                </button>

                <a href="{% url 'lista_reservaciones' %}"
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </div>

        </form>

    </div>
</div>

<style>
    .formulario-reservacion p {
        margin-bottom: 20px;
    }

    .formulario-reservacion label {
        display: block;
        font-weight: 600;
        margin-bottom: 7px;
    }

    .formulario-reservacion input,
    .formulario-reservacion select,
    .formulario-reservacion textarea {
        display: block;
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 6px;
        background-color: white;
    }

    .formulario-reservacion .errorlist {
        color: #dc3545;
        margin-top: 5px;
        padding-left: 20px;
    }

    .formulario-reservacion input:focus,
    .formulario-reservacion select:focus {
        border-color: #183153;
        outline: none;
        box-shadow: 0 0 4px rgba(24, 49, 83, 0.2);
    }
</style>

{% endblock %}
