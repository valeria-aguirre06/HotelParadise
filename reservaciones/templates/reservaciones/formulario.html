<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }} - Hotel Paradise</title>
</head>
<body>
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Guardar reservación</button>
    </form>

    <p>
        <a href="{% url 'lista_reservaciones' %}">
            Volver a la lista de reservaciones
        </a>
    </p>
</body>
</html>
