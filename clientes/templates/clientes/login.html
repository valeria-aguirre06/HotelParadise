
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Hotel Paradise</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
        }

        .encabezado {
            background-color: #183153;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .tarjeta-login {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        }

        .titulo {
            color: #183153;
        }

        .btn-primary {
            background-color: #183153;
            border-color: #183153;
        }

        .btn-primary:hover {
            background-color: #294d79;
            border-color: #294d79;
        }

        .formulario-login p {
            margin-bottom: 20px;
        }

        .formulario-login label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .formulario-login input:not([type="hidden"]) {
            display: block;
            width: 100%;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            background-color: white;
        }

        .formulario-login input:focus {
            border-color: #183153;
            outline: none;
            box-shadow: 0 0 4px rgba(24, 49, 83, 0.2);
        }

        .errorlist {
            color: #dc3545;
        }
    </style>
</head>

<body>

    <header class="encabezado">
        <h2 class="fw-bold mb-0">Hotel Paradise</h2>
    </header>

    <main class="container">
        <div class="row justify-content-center mt-5">

            <div class="col-md-6 col-lg-5">

                <div class="card tarjeta-login">
                    <div class="card-body p-4 p-md-5">

                        <h2 class="titulo fw-bold text-center mb-3">
                            Iniciar sesión
                        </h2>

                        <p class="text-muted text-center mb-4">
                            Ingresa tus datos para acceder al sistema.
                        </p>

                        {% if form.errors %}
                            <div class="alert alert-danger">
                                Usuario o contraseña incorrectos.
                                Revisa tus datos e intenta nuevamente.
                            </div>
                        {% endif %}

                        <form method="post" class="formulario-login">

                            {% csrf_token %}

                            {{ form.as_p }}

                            <input type="hidden"
                                   name="next"
                                   value="{{ next }}">

                            <button type="submit"
                                    class="btn btn-primary w-100 mt-3">
                                Iniciar sesión
                            </button>

                        </form>

                    </div>
                </div>

                <p class="text-center text-muted mt-4">
                    Sistema de administración de Hotel Paradise
                </p>

            </div>
        </div>
    </main>

</body>
</html>
